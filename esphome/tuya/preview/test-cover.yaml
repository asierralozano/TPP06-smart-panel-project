# TPP06 · UI estilo Tuya — PREVISUALIZACIÓN de la tarjeta de PERSIANA (cover)
#
# Una estancia con dos persianas (abierta al 65 % y cerrada) y su detalle.
#   ESPHOME=.venv/bin/esphome sh esphome/tuya/preview/run.sh \
#       esphome/tuya/preview/test-cover.yaml /tmp/shots-cover
substitutions:
  device_name: tpp06-test-cover
  assets_dir: ../../tuya-assets
  tuya_dir: ".."
  default_language: "0"
  preview_api_port: "6061"
  weather_entity: weather.demo
  cc_on_entity: scene.demo_todo_encendido
  cc_off_entity: scene.demo_todo_apagado

packages:
  hw: !include ../hw/preview.yaml
  core: !include ../core.yaml
  salon: !include {file: ../room.yaml, vars: {room: salon, title: "Salón"}}
  persiana: !include {file: ../cards/cover.yaml, vars: {uid: persiana, room: salon, entity: cover.persiana, name: "Persiana"}}
  estor: !include {file: ../cards/cover.yaml, vars: {uid: estor, room: salon, entity: cover.estor, name: "Estor"}}

esphome:
  on_boot:
    priority: -100
    then:
      - delay: 300ms
      - script.execute: preview_demo_data
      - script.execute: preview_shots

script:
  - id: preview_demo_data
    then:
      - lambda: |-
          id(ui_weather_state).publish_state("sunny");
          id(ui_weather_temp).publish_state(26);
          id(persiana_state).publish_state("open");
          id(persiana_pos).publish_state(65);
          id(estor_state).publish_state("closed");
          id(estor_pos).publish_state(0);

  # Captura la estancia y el detalle, y sale.
  - id: preview_shots
    then:
      - delay: 700ms
      - lvgl.page.show: page_salon
      - delay: 400ms
      - snapshot.take: {id: tpp06_display, filename: cover_room.bmp}
      - lvgl.page.show: page_persiana_detail
      - delay: 400ms
      - snapshot.take: {id: tpp06_display, filename: cover_detail.bmp}
      - delay: 300ms
      - lambda: exit(0);
