# TPP06 · UI estilo Tuya — PREVISUALIZACIÓN de la tarjeta de termostato (climate)
#
#   ESPHOME=.venv/bin/esphome sh esphome/tuya/preview/run.sh \
#       esphome/tuya/preview/test-climate.yaml /tmp/shots
substitutions:
  device_name: tpp06-test-climate
  assets_dir: ../../tuya-assets
  preview_api_port: "6062"
  weather_entity: weather.demo
  cc_on_entity: scene.demo_todo_encendido
  cc_off_entity: scene.demo_todo_apagado

packages:
  hw: !include ../hw/preview.yaml
  core: !include ../core.yaml
  salon: !include {file: ../room.yaml, vars: {room: salon, title: "Salón"}}
  termo: !include {file: ../cards/climate.yaml, vars: {uid: termo, room: salon, entity: climate.salon, name: "Termostato"}}
  termo_dorm: !include {file: ../cards/climate.yaml, vars: {uid: termo_dorm, room: salon, entity: climate.dormitorio, name: "Dormitorio"}}

esphome:
  on_boot:
    priority: -100
    then:
      - delay: 300ms
      - script.execute: preview_demo_data
      - script.execute: preview_shots

script:
  - id: preview_demo_data
    then:
      - lambda: |-
          id(ui_weather_state).publish_state("sunny");
          id(ui_weather_temp).publish_state(26);
          id(termo_mode).publish_state("heat");
          id(termo_target).publish_state(21);
          id(termo_current).publish_state(19);
          id(termo_dorm_mode).publish_state("off");
          id(termo_dorm_target).publish_state(NAN);
          id(termo_dorm_current).publish_state(17.5);

  - id: preview_shots
    then:
      - delay: 700ms
      - lvgl.page.show: page_salon
      - delay: 400ms
      - snapshot.take: {id: tpp06_display, filename: climate_room.bmp}
      - lvgl.page.show: page_termo_detail
      - delay: 400ms
      - snapshot.take: {id: tpp06_display, filename: thermostat_detail.bmp}
      # Pulsación "+" simulada: consigna optimista 21.5 y °C realineado.
      - script.execute: {id: termo_step, delta: 0.5}
      - delay: 400ms
      - snapshot.take: {id: tpp06_display, filename: thermostat_step.bmp}
      - delay: 300ms
      - lambda: exit(0);
