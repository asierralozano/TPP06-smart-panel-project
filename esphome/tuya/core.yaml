# ─────────────────────────────────────────────────────────────────────────────
# TPP06 · UI estilo Tuya — NÚCLEO (tema, pantallas globales y lógica común)
#
# Independiente del hardware: no referencia drivers del panel. Lo que depende del
# hardware lo implementa la capa hw/ con estos contratos:
#   - lvgl id `mobile_ui`, display `tpp06_display`, time id `ha_time`
#   - switch `touch_beep` (pitido al tocar)
#   - scripts `ui_hw_apply_brightness` y `ui_hw_restart`
#   - global `ui_wifi_ok` (-1 desconocido, 0 sin enlace, 1 enlace)
# Coordenadas, colores y tamaños 1:1 del clon C (TPP06-custom-ui, tag c-lvgl-v1),
# derivado del firmware Tuya 1.2.3. Assets en ${assets_dir} (privados, no en git).
#
# Substituciones que debe definir el fichero principal:
#   assets_dir, weather_entity, cc_on_entity, cc_off_entity
# ─────────────────────────────────────────────────────────────────────────────

# ───────────────────────────── Fuentes (Manrope) ─────────────────────────────
font:
  - {file: "gfonts://Manrope@400", id: f14, size: 14, bpp: 4, glyphsets: [GF_Latin_Kernel, GF_Latin_Core], glyphs: ["°"]}
  - {file: "gfonts://Manrope@400", id: f15, size: 15, bpp: 4, glyphsets: [GF_Latin_Kernel, GF_Latin_Core], glyphs: ["°"]}
  - {file: "gfonts://Manrope@400", id: f16, size: 16, bpp: 4, glyphsets: [GF_Latin_Kernel, GF_Latin_Core], glyphs: ["°"]}
  - {file: "gfonts://Manrope@400", id: f17, size: 17, bpp: 4, glyphsets: [GF_Latin_Kernel, GF_Latin_Core], glyphs: ["°"]}
  - {file: "gfonts://Manrope@400", id: f18, size: 18, bpp: 4, glyphsets: [GF_Latin_Kernel, GF_Latin_Core], glyphs: ["°"]}
  - {file: "gfonts://Manrope@500", id: f19, size: 19, bpp: 4, glyphs: ["0123456789-°. "]}
  - {file: "gfonts://Manrope@400", id: f20, size: 20, bpp: 4, glyphsets: [GF_Latin_Kernel, GF_Latin_Core], glyphs: ["°"]}
  - {file: "gfonts://Manrope@400", id: f22, size: 22, bpp: 4, glyphsets: [GF_Latin_Kernel, GF_Latin_Core], glyphs: ["°"]}
  - {file: "gfonts://Manrope@400", id: f26, size: 26, bpp: 4, glyphsets: [GF_Latin_Kernel, GF_Latin_Core], glyphs: ["°"]}
  # Tamaños grandes: solo los glifos necesarios (ahorra binario/OTA).
  - {file: "gfonts://Manrope@400", id: f36, size: 36, bpp: 4, glyphs: ["0123456789-.,°C% "]}
  - {file: "gfonts://Manrope@400", id: f40, size: 40, bpp: 4, glyphs: ["+-"]}
  - {file: "gfonts://Manrope@400", id: f48, size: 48, bpp: 4, glyphs: ["0123456789-%"]}
  - {file: "gfonts://Manrope@500", id: f67, size: 67, bpp: 4, glyphs: ["0123456789-.,"]}
  - {file: "gfonts://Manrope@500", id: f90, size: 90, bpp: 4, glyphs: ["0123456789:-"]}
  - {file: "gfonts://Manrope@800", id: f150, size: 150, bpp: 4, glyphs: ["0123456789-"]}

