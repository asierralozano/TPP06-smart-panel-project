# TPP06 · UI estilo Tuya — TARJETA DE LUZ (+ página de detalle con brillo)
#
#   mesa: !include
#     file: tuya/cards/light.yaml
#     vars: {uid: mesa, room: salon, entity: light.mesa, name: "Mesa"}
#
# Toque corto = encender/apagar · pulsación larga = detalle (brillo).
# `uid` debe ser único y válido como identificador (a-z, 0-9, _).
text_sensor:
  - platform: homeassistant
    id: "${uid}_state"
    entity_id: ${entity}
    internal: true
    on_value:
      - script.execute: ${uid}_refresh

sensor:
  - platform: homeassistant
    id: "${uid}_bri"
    entity_id: ${entity}
    attribute: brightness
    internal: true
    on_value:
      - script.execute: ${uid}_refresh

script:
  - id: "${uid}_refresh"
    then:
      - lambda: |-
          const std::string &s = id(${uid}_state).state;
          const bool on = s == "on";
          const float raw = id(${uid}_bri).state;
          const int pct = on ? (std::isnan(raw) ? 100 : std::max(1, (int) lroundf(raw * 100.0f / 255.0f))) : 0;
          const char *txt = s == "on" ? "Encendida" : s == "off" ? "Apagada" :
                            s.empty() ? "--" : "No disponible";
          const auto green = lv_color_hex(0x9AE6C0), grey = lv_color_hex(0x8A8A95);
          // Tarjeta
          lv_label_set_text(id(${uid}_sub), txt);
          lv_obj_set_style_text_color(id(${uid}_sub), on ? green : grey, 0);
          lv_bar_set_value(id(${uid}_bar), pct, LV_ANIM_OFF);
          lv_obj_set_style_bg_opa(id(${uid}_bar), on ? LV_OPA_COVER : LV_OPA_40, 0);
          // Detalle
          lv_label_set_text(id(${uid}_dstate), txt);
          lv_obj_set_style_text_color(id(${uid}_dstate), on ? green : grey, 0);
          lv_label_set_text(id(${uid}_dpct), str_sprintf("%d%%", pct).c_str());
          lv_obj_set_style_text_color(id(${uid}_dpct), lv_color_hex(on ? 0x3A2E12 : 0x6A6A72), 0);
          if (!lv_obj_has_state(id(${uid}_slider), LV_STATE_PRESSED))
            lv_slider_set_value(id(${uid}_slider), on ? pct : 1, LV_ANIM_OFF);
      - lvgl.image.update:
          id: "${uid}_btn"
          src: !lambda 'return id(${uid}_state).state == "on" ? id(img_on) : id(img_off);'
      - lvgl.image.update:
          id: "${uid}_dbtn"
          src: !lambda 'return id(${uid}_state).state == "on" ? id(img_on) : id(img_off);'

lvgl:
  pages:
    - id: !extend page_${room}
      widgets:
        - obj:
            id: "${uid}_card"
            styles: tuya_card
            width: 288
            height: 96
            on_short_click:
              - homeassistant.action: {action: light.toggle, data: {entity_id: "${entity}"}}
            on_long_press:
              - lvgl.page.show: page_${uid}_detail
            widgets:
              - image: {id: "${uid}_btn", src: img_off, x: 14, y: 20}
              - label: {x: 84, y: 18, text: "${name}", text_font: f17}
              - label: {id: "${uid}_sub", x: 84, y: 46, text: "--", text_font: f14, text_color: 0x8A8A95}
              - bar:
                  id: "${uid}_bar"
                  x: 84
                  y: 72
                  width: 188
                  height: 8
                  min_value: 0
                  max_value: 100
                  value: 0
                  radius: 4
                  bg_color: 0x33333A
                  bg_opa: COVER
                  indicator: {bg_color: 0x57C891, radius: 4}

    # Detalle: barra de brillo vertical grande (como Tuya) + power + %.
    - id: "page_${uid}_detail"
      skip: true
      bg_color: 0x0C0C10
      on_swipe_right:
        - lvgl.page.show: {id: "page_${room}", animation: MOVE_RIGHT, time: 200ms}
      widgets:
        - button:
            styles: tuya_back_btn
            x: 9
            y: 9
            width: 48
            height: 48
            on_click:
              - lvgl.page.show: page_${room}
            widgets:
              - image: {src: img_left, align: CENTER, image_recolor: 0xFFFFFF, image_recolor_opa: COVER}
        - label: {x: 58, y: 22, text: "${name}", text_font: f20}
        - slider:
            id: "${uid}_slider"
            x: 168
            y: 96
            width: 120
            height: 320
            min_value: 1
            max_value: 100
            value: 1
            radius: 30
            bg_color: 0x1C1C1E
            bg_opa: COVER
            indicator: {radius: 30, bg_color: 0xFFD98A}
            knob: {bg_opa: TRANSP, shadow_width: 0, pad_all: 0}
            on_value:
              - lvgl.label.update: {id: "${uid}_dpct", text: !lambda 'return str_sprintf("%d%%", (int) x);'}
            on_release:
              - homeassistant.action:
                  action: light.turn_on
                  data:
                    entity_id: "${entity}"
                    brightness_pct: !lambda return to_string((int) x);
        - label: {id: "${uid}_dpct", x: 168, y: 114, width: 120, text_align: CENTER, text: "0%", text_font: f26, text_color: 0x6A6A72}
        - image:
            id: "${uid}_dbtn"
            src: img_off
            x: 44
            y: 150
            clickable: true
            on_click:
              - homeassistant.action: {action: light.toggle, data: {entity_id: "${entity}"}}
        - label: {id: "${uid}_dstate", x: 40, y: 220, text: "--", text_font: f18, text_color: 0x8A8A95}
        - label: {x: 40, y: 258, text: "Brillo", text_font: f15, text_color: 0x6A6A72}
