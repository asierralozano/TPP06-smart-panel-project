# TPP06 · UI estilo Tuya — TARJETA DE SENSOR temperatura + humedad (cont_wsdcg.lua)
#
#   clima: !include
#     file: tuya/cards/sensor_th.yaml
#     vars: {uid: clima, room: cocina, name: "Clima",
#            temp_entity: sensor.cocina_temperatura, hum_entity: sensor.cocina_humedad}
#
# Solo lectura. Para un sensor con una sola magnitud, apunta las dos a la misma
# entidad o usa otra tarjeta.
sensor:
  - platform: homeassistant
    id: "${uid}_temp"
    entity_id: ${temp_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: "${uid}_tv"
          text: !lambda |-
            if (std::isnan(x)) return std::string("-- °C");
            return str_sprintf("%.0f °C", x);
  - platform: homeassistant
    id: "${uid}_hum"
    entity_id: ${hum_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: "${uid}_hv"
          text: !lambda |-
            if (std::isnan(x)) return std::string("-- %");
            return str_sprintf("%.0f %%", x);

lvgl:
  pages:
    - id: !extend page_${room}
      widgets:
        - obj:
            id: "${uid}_card"
            styles: tuya_card
            width: 288
            height: 150
            widgets:
              - label: {x: 18, y: 16, text: "${name}", text_font: f17}
              - label: {id: "${uid}_tv", x: 0, y: 60, width: 144, text_align: CENTER, text: "-- °C", text_font: f36}
              - label: {x: 0, y: 112, width: 144, text_align: CENTER, id: "${uid}_t_temp", text: "Temperatura", text_font: f15, text_color: 0x8A8A95}
              - label: {id: "${uid}_hv", x: 144, y: 60, width: 144, text_align: CENTER, text: "-- %", text_font: f36}
              - label: {x: 144, y: 112, width: 144, text_align: CENTER, id: "${uid}_t_hum", text: "Humedad", text_font: f15, text_color: 0x8A8A95}

script:
  - id: !extend ui_apply_language
    then:
      - lvgl.label.update: {id: "${uid}_t_temp", text: !lambda return std::string(T(TR_TEMPERATURE));}
      - lvgl.label.update: {id: "${uid}_t_hum", text: !lambda return std::string(T(TR_HUMIDITY));}
